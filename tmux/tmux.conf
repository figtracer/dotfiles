source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^A
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi
set -g pane-active-border-style 'fg=#79c0ff,bg=default'
set -g pane-border-style 'fg=#30363d,bg=default'
set -g mouse on

# --- GitHub Dark Status Bar ---
set -g status-style 'bg=#161b22,fg=#e6edf3'
set -g status-left-length 40
set -g status-right-length 60
set -g status-left '#[fg=#0d1117,bg=#79c0ff,bold] #S #[fg=#79c0ff,bg=#161b22,nobold] '
set -g status-right '#[fg=#8b949e]#{b:pane_current_path}  #[fg=#e6edf3]%H:%M '
set -g window-status-format '#[fg=#8b949e] #I:#W '
set -g window-status-current-format '#[fg=#79c0ff,bold] #I:#W#{?window_zoomed_flag,(),} '
set -g window-status-separator ''
set -g message-style 'fg=#e6edf3,bg=#30363d'
set -g mode-style 'fg=#e6edf3,bg=#264f78'

# --- Plugins (installed by tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.tmux/plugins/tpm/tpm'
